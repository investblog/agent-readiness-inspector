<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Readiness Inspector</title>
  </head>
  <body>
    <main id="app" class="panel">
      <header class="panel-header">
        <div class="panel-title">
          <h1 data-i18n="popupTitle">Agent Readiness Inspector</h1>
          <span id="target-origin" class="panel-origin"></span>
        </div>
        <div class="panel-actions">
          <button id="open-dashboard" type="button" class="icon-btn" data-i18n-title="openDashboard"></button>
          <button id="save-site" type="button" class="icon-btn" hidden></button>
          <button id="rescan" type="button" class="icon-btn" data-i18n-title="rescan" hidden></button>
          <button id="theme-toggle" type="button" class="icon-btn" data-i18n-title="toggleTheme"></button>
        </div>
      </header>

      <section id="state-scanning" class="panel-state" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p data-i18n="scanning">Scanning…</p>
      </section>

      <section id="state-error" class="panel-state" hidden>
        <p id="error-message" class="error-text"></p>
        <button id="retry-button" type="button" class="btn" data-i18n="retry">Retry</button>
      </section>

      <section id="state-results" hidden>
        <div class="score-block">
          <div id="score-ring" class="score-ring"><span id="score-value">0</span></div>
          <div class="score-meta">
            <span id="level-badge" class="level-badge"></span>
            <span id="level-name" class="level-name"></span>
          </div>
        </div>
        <div id="categories" class="category-row"></div>
        <div id="checklist" class="checklist"></div>
        <p id="unreached-note" class="footnote" hidden></p>
        <p id="scanned-at" class="footnote"></p>
      </section>

      <footer class="panel-footer">
        <a
          id="footer-brand"
          href="https://301.st/?utm_source=agent-readiness-inspector&amp;utm_medium=extension&amp;utm_campaign=panel"
          target="_blank"
          rel="noreferrer noopener"
          title="301.st — Smart Traffic"
        >
          <span data-i18n="craftedAt">Crafted at</span>
        </a>
        <span class="footer-spacer"></span>
        <a id="rate-link" href="#" target="_blank" rel="noreferrer noopener" hidden></a>
        <a
          href="https://github.com/investblog/agent-readiness-inspector/issues"
          target="_blank"
          rel="noreferrer noopener"
          data-i18n-title="feedbackGithub"
          id="github-link">GitHub</a
        >
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
